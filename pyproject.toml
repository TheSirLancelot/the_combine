[project]
name = "combine"
version = "0.1.0"
description = "Read-only fantasy football co-owner. Live league state over MCP plus a blended projection layer."
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "espn-api>=0.44",
    "yahoofantasy>=1.4",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.9",
]

[project.scripts]
combine = "combine.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/combine"]

[tool.ruff]
line-length = 100
